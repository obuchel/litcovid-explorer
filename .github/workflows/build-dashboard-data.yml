name: Build dashboard data

# Save as .github/workflows/build-dashboard-data.yml
# Start it with "Run workflow" on the Actions tab or from the Dashboard data panel.
# Do NOT use "Re-run jobs" on an old run: that repeats the old commit. Start a new run so the latest files are used.
# Python files expected in scripts/: slim_tags.py, build_dashboard_data.py, add_network_pages.py

on:
  workflow_dispatch:
    inputs:
      source:
        description: PubTator file in the repo (raw records, or an already slim file)
        default: public/data/pubtator_records.jsonl.gz
      slim_first:
        description: Run slim_tags.py first (turn off if the file is already slim)
        type: boolean
        default: true
      mesh_tree:
        description: MeSH category tree JSON (leave empty to skip the categories page)
        default: public/data/mesh_category_tree_predicted_diseases.json
      out_dirs:
        description: Folders to write the rebuilt data to (space-separated)
        default: data public/data

permissions:
  contents: write   # commit the rebuilt data
  actions: write    # start the deploy workflow afterwards

concurrency:
  group: build-dashboard-data
  cancel-in-progress: false

env:
  DEPLOY_WORKFLOW: deploy-pages.yml   # must have a workflow_dispatch trigger
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check that the files are there
        env:
          SRC: ${{ inputs.source }}
          SLIM_FIRST: ${{ inputs.slim_first }}
        run: |
          echo "Commit: $(git rev-parse --short HEAD) on ${{ github.ref_name }}"
          missing=0
          for f in scripts/slim_tags.py scripts/build_dashboard_data.py scripts/add_network_pages.py "$SRC"; do
            if [ -f "$f" ]; then echo "found   $f ($(du -h "$f" | cut -f1))"; else echo "::error::missing $f"; missing=1; fi
          done
          echo "--- scripts/ ---"; ls scripts || true
          exit $missing

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install numpy scipy scikit-learn

      - name: Slim the tags
        env:
          SRC: ${{ inputs.source }}
          SLIM_FIRST: ${{ inputs.slim_first }}
        run: |
          set -uo pipefail
          mkdir -p work
          if [ "$SLIM_FIRST" = "true" ]; then
            python scripts/slim_tags.py "$SRC" work/slim.jsonl.gz || { c=$?; echo "::error::slim_tags.py failed with exit code $c"; exit $c; }
          else
            cp "$SRC" work/slim.jsonl.gz
          fi
          ls -la work

      - name: Build the dashboard data
        env:
          MESH: ${{ inputs.mesh_tree }}
          OUT_DIRS: ${{ inputs.out_dirs }}
        run: |
          set -uo pipefail
          ARGS=""
          if [ -n "$MESH" ] && [ -f "$MESH" ]; then
            ARGS="--mesh-tree $MESH"
          else
            echo "::warning::No MeSH tree file ('$MESH'), so the categories page is skipped"
          fi
          # build once into a scratch folder, then copy only the generated files into each target folder
          python scripts/build_dashboard_data.py work/slim.jsonl.gz -o work/out $ARGS || { c=$?; echo "::error::build_dashboard_data.py failed with exit code $c"; exit $c; }
          python scripts/add_network_pages.py work/slim.jsonl.gz work/out || { c=$?; echo "::error::add_network_pages.py failed with exit code $c"; exit $c; }
          for d in $OUT_DIRS; do
            mkdir -p "$d"
            cp -r work/out/. "$d"/
            echo "Wrote the rebuilt data to $d"
          done

      - name: Commit the new data
        env:
          OUT_DIRS: ${{ inputs.out_dirs }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for d in $OUT_DIRS; do git add "$d"; done
          if git diff --cached --quiet; then
            echo "Nothing changed in $OUT_DIRS"
          else
            git commit -m "Rebuild dashboard data"
            git pull --rebase
            git push
          fi

      - name: Redeploy the site
        continue-on-error: true   # a wrong workflow name here should not fail the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "$DEPLOY_WORKFLOW" --repo "${{ github.repository }}"
