<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lifepath dashboard</title><link rel="icon" href="data:,"><style>body{font:15px/1.5 system-ui,sans-serif;margin:40px auto;max-width:640px;padding:0 16px;color:#222}code{background:#eee;padding:1px 4px;border-radius:3px}@media(prefers-color-scheme:dark){body{background:#151515;color:#ddd}code{background:#333}}</style></head><body><p id="ld">Loading…</p>
<script type="text/plain" id="tpl-app"><title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: control bar on top; big scatter (inflection time x slope) left, selected-disease detail right; stacks on phones. */
:root{
  --bg:#f6f6f3; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#7b7a74; --grid:#e1e0d9; --axis:#c3c2b7;
  --accent:#2a78d6; --c0:#17935f; --c1:#4a3aa7; --c2:#d9622b; --c3:#8b8a84; --ring:#0b0b0b; --chip:#efeeea; --w0:#d9622b; --w1:#8a6fb3; --w2:#1a9b7f; --w3:#2a78d6;
  --serif:'IBM Plex Serif',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#8f8e88; --grid:#2c2c2a; --axis:#383835;
  --accent:#3987e5; --c0:#3fbf7f; --c1:#9085e9; --c2:#e66767; --c3:#7d7c76; --ring:#ffffff; --chip:#242422; --w0:#f08a5d; --w1:#b39ddb; --w2:#35c4a6; --w3:#3987e5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#8f8e88; --grid:#2c2c2a; --axis:#383835;
  --accent:#3987e5; --c0:#3fbf7f; --c1:#9085e9; --c2:#e66767; --c3:#7d7c76; --ring:#ffffff; --chip:#242422; --w0:#f08a5d; --w1:#b39ddb; --w2:#35c4a6; --w3:#3987e5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:20px 32px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:600 26px/1.15 var(--serif);margin:0;text-wrap:balance}
.sub{color:var(--ink2);margin:4px 0 0;max-width:70ch}
.bar{position:sticky;top:0;z-index:15;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
label,.lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
input[type=search],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--axis);border-radius:6px;padding:7px 10px;min-width:0}
input[type=search]{width:min(320px,100%)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{position:relative;flex:1 1 260px;max-width:360px}
.results{position:absolute;z-index:20;top:100%;left:0;right:0;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--axis);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:320px;overflow:auto}
.results li{padding:6px 8px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.results li[aria-selected=true],.results li:hover{background:var(--chip)}
.results .n{font:400 11px var(--mono);color:var(--muted);white-space:nowrap}
.results mark{background:none;color:var(--accent);font-weight:600}
.snap{display:flex;align-items:center;gap:10px}
input[type=range]{width:200px;max-width:100%;accent-color:var(--accent)}
.yr{font:500 20px var(--mono);min-width:9ch}
button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--axis);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px}
.chip[aria-pressed=false]{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:14px;min-width:0}
.plot{position:relative}
canvas{display:block;width:100%;height:540px;touch-action:manipulation;cursor:crosshair}
canvas.zoomed{touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}
.zbar{display:flex;gap:4px;justify-content:flex-end;align-items:center;margin-bottom:8px}
.zbar .zh{margin-right:auto;font-size:12px;color:var(--muted)}
.zbar button{padding:4px 0;width:30px;background:var(--surface)}
.zbar #zreset{width:auto;padding:4px 9px;font-size:12px}
#cv2{height:300px;cursor:default;touch-action:auto}
#cv3{height:180px;cursor:default;touch-action:auto}
@media (max-width:600px){#cv2{height:220px}}
.dens{margin-top:14px;padding-top:12px;border-top:1px solid var(--grid)}
.dhead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--ink2)}
.dhead .h3{margin:0 auto 0 0}
.dhead select{padding:4px 8px;font-size:12px}
.dhead label{display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink2);font-weight:400}
.dleg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:11px;color:var(--muted);margin-top:6px}
.dleg i{display:inline-block;width:14px;height:10px;border-radius:2px}
@media (max-width:600px){canvas{height:420px}}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--axis);border-radius:6px;padding:7px 9px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:240px;z-index:5}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.tip .m{font:400 11px var(--mono);color:var(--ink2)}
.stat{display:flex;justify-content:space-between;color:var(--ink2);font-size:12px;margin-top:8px;flex-wrap:wrap;gap:6px}
.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.top button{font-size:12px;padding:4px 9px}
h2{font:600 18px/1.25 var(--serif);margin:0;overflow-wrap:anywhere}
.id{font:400 11px var(--mono);color:var(--muted)}
table{width:100%;border-collapse:collapse;font:400 12px var(--mono);font-variant-numeric:tabular-nums;margin-top:10px}
th{font:500 10px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:4px 4px}
td{padding:4px 4px;text-align:right;border-top:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left}
tr.cur td{background:var(--chip)}
.ph{font-family:var(--sans);display:inline-flex;align-items:center;gap:5px}
.note{color:var(--muted);font-size:12px;margin:10px 0 0}
svg text{fill:var(--muted);font:400 10px var(--mono)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}

.tabs{display:flex;gap:0}
.tabs button{border-radius:0;padding:6px 12px}
.tabs button:first-child{border-radius:6px 0 0 6px}.tabs button:last-child{border-radius:0 6px 6px 0;border-left:0}
.tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--axis);border-radius:6px;padding:7px 8px;width:84px;font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.rule{font-size:12px;color:var(--ink2);margin:0 0 8px}
.spark{display:grid;grid-template-columns:14px 1fr auto;gap:2px 8px;align-items:center;font-size:12px}
.spark .nm{display:flex;justify-content:space-between;gap:8px}
.spark .v{font:500 13px var(--mono);font-variant-numeric:tabular-nums;text-align:right;min-width:5ch}
.h3{font:600 14px var(--serif);margin:0 0 6px}
.reset{font-size:12px;padding:6px 10px}
.wl{display:grid;grid-template-columns:12px 1fr;gap:4px 8px;font-size:12px;margin-top:8px;align-items:baseline}
.wl small{color:var(--muted);display:block}
.wtag b{font-weight:600}
.pgnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}.pgnav a{padding:5px 12px;border-radius:999px;background:var(--chip);color:var(--ink2);text-decoration:none;border:1px solid transparent}.pgnav a:hover{border-color:var(--axis)}.pgnav a[aria-current=page]{background:var(--ink);color:var(--bg);font-weight:500}

/* full-width header + insights */
.hero{margin:-20px -16px 0;padding:18px 16px 18px;background:var(--surface);border-bottom:1px solid var(--grid)}
.hin{width:100%;display:flex;flex-direction:column;gap:12px}
.hgrid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(300px,1fr);gap:12px 48px;align-items:start}
.hero header{min-width:0}
.lead{color:var(--ink2);font-size:15.5px;line-height:1.6;margin:8px 0 0;max-width:none}
.phases{border-left:3px solid var(--grid);padding:2px 0 2px 18px;display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--ink2)}
.phases .ph-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.phases .ph{display:grid;grid-template-columns:12px 108px 1fr;gap:0 8px;align-items:baseline}
.phases .ph i{width:10px;height:10px;border-radius:50%;display:inline-block}
.phases .ph b{color:var(--ink);font-weight:600}
.phases .ph-f{color:var(--muted);font-size:12px;line-height:1.45;margin-top:2px}
.insights{background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:16px 20px}
.insights h2{font:600 19px/1.2 var(--serif);margin:0 0 4px}
.insights .ins-s{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.insights ul{margin:0;padding-left:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:8px 36px;list-style:disc;color:var(--ink2);font-size:14px;line-height:1.55}
.insights li{padding-right:6px}
.insights .vh{font:600 14px var(--sans);color:var(--ink);margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--grid)}.insights .vh:empty{display:none}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 8px);z-index:60;width:max-content;max-width:min(300px,78vw);background:var(--ink);color:var(--bg);font:400 12px/1.45 var(--sans);letter-spacing:0;text-transform:none;text-align:left;white-space:normal;padding:8px 11px;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none}
@media(max-width:860px){.hgrid{grid-template-columns:1fr}.phases{border-left:0;padding-left:0}}
.more{flex:1 1 100%}.more summary{cursor:pointer;font-size:12px;color:var(--ink2);padding:4px 0}
.morei{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;margin-top:8px}
@media(min-width:701px){.more summary{display:none}}
@media(max-width:700px){
 body{padding-inline:12px}.hero{margin-inline:-12px;padding:12px 12px 16px}
 .pgnav{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;margin-inline:-12px;padding:0 12px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 .pgnav::-webkit-scrollbar{display:none}.pgnav a{flex:none;padding:7px 12px}
 h1{font-size:22px}.lead{font-size:14px;line-height:1.5}
 .phases .ph{grid-template-columns:12px 96px 1fr}
 .bar{position:static;padding:10px 12px;gap:10px 14px}.bar>.field{flex:1 1 100%}.search{max-width:none}input[type=search]{width:100%;font-size:16px}
 select,input[type=number]{font-size:16px}
 .snap{flex-wrap:wrap}input[type=range]{flex:1;min-width:120px;width:auto}
 .tabs button{padding:9px 14px}button,.chip{min-height:36px}
 .card{padding:10px}.insights{padding:12px}.insights ul{grid-template-columns:1fr}
 .ctl{flex-direction:column;align-items:stretch}.ctl .field{flex:1 1 100%}.ctl select,.ctl input{width:100%;max-width:none}
}
.kchoice{background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:12px 18px}
.kchoice summary{cursor:pointer;font:600 15px var(--serif)}
.kchoice p{color:var(--ink2);max-width:95ch;line-height:1.55;margin:10px 0}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:8px 0}
.kchoice svg .ct{font:600 12px var(--sans);fill:var(--ink)}.kchoice svg .at{font:400 10px var(--mono);fill:var(--muted)}.kchoice svg .gl{stroke:var(--grid)}
.kt{width:100%;border-collapse:collapse;font:400 12px var(--mono);min-width:560px}.kt th{font:500 10px var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:4px 6px}.kt td{padding:5px 6px;text-align:right;border-top:1px solid var(--grid)}.kt th:first-child,.kt td:first-child{text-align:left}.kt tr.sel td{background:var(--chip);font-weight:600}
#plotcard.listmode>*:not(#listtab):not(.stat){display:none!important}#listtab{display:none}#plotcard.listmode>#listtab{display:block}#listbox{max-height:640px;overflow:auto;border:1px solid var(--grid);border-radius:8px;margin-top:8px}#listtab .lt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#listtab input[type=search]{font:inherit;padding:6px 8px;border:1px solid var(--grid);border-radius:8px;background:var(--surface);color:var(--ink)}#listtab button{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--grid);border-radius:8px;background:var(--chip);color:var(--ink);cursor:pointer}#counts .spark{grid-template-columns:14px minmax(0,1fr) auto 14px minmax(0,1fr) auto;gap:8px 14px}#counts .spark .nm{white-space:nowrap}@media(max-width:760px){#counts .spark{grid-template-columns:14px minmax(0,1fr) auto}}
</style><body>
<div class="hero"><div class="hin"><!--NAV--><div class="hgrid"><header><h1>{{title}}</h1><p class="lead">{{lead}}</p></header><div class="phases"><div class="ph-h">The four phases</div>
<div class="ph"><i style="background:var(--c0)"></i><b>Acceleration</b><span>the fitted inflection is still ahead: growth is speeding up</span></div>
<div class="ph"><i style="background:var(--c1)"></i><b>Inflection</b><span>growth is at its fastest now, within a month of the fitted inflection</span></div>
<div class="ph"><i style="background:var(--c2)"></i><b>Deceleration</b><span>the inflection is behind: still growing, but slowing</span></div>
<div class="ph"><i style="background:var(--c3)"></i><b>Deactivation</b><span>the curve has reached its ceiling: few new papers</span></div>
<div class="ph-f">On the plot, each line with dots is one term. Each dot is the term at one snapshot, placed by its fitted inflection date (left to right) and steepness (steeper curves sit lower); dot size is papers so far and the line joins the term’s snapshots.</div></div></div></div></div>
<div class="wrap">

  <div class="bar">
    <div class="field">
      <span class="lab">View</span>
      <div class="tabs"><button id="v1" type="button" aria-pressed="true" data-tip="Each line with dots is one term. Each dot places the term by its fitted inflection date (left to right) and steepness at one snapshot, and the line joins a term’s snapshots, so you can follow its whole lifepath.">Lifepaths</button><button id="v2" type="button" aria-pressed="false" data-tip="Shows the phase rule itself: papers so far against months since the fitted inflection. Drag the dashed thresholds to reclassify every term and see how sensitive each label is.">Classification rule</button><button id="v3" type="button" aria-pressed="false">List of all terms</button></div>
    </div>
    <div class="field" id="xfield" style="display:none"><label for="xsel">Classification x-axis</label><select id="xsel"><option value="n">Papers so far (ln)</option><option value="s">Fitted saturation (log)</option></select></div>
    <div class="field" id="lvfield" data-levels><label for="lvsel">Level</label><select id="lvsel"><option value="0">All</option><option value="2">Categories</option><option value="3">Subcategories</option></select></div>
    <div class="field search">
      <label for="q">Search diseases by name</label>
      <input id="q" type="search" placeholder="{{ph}}" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="res">
      <ul class="results" id="res" role="listbox" hidden></ul>
    </div>
    <div class="field">
      <span class="lab">Snapshot</span>
      <div class="snap"><span class="yr" id="yr">May 2026</span><input id="sl" type="range" min="0" max="{{lastSnap}}" step="1" value="{{lastSnap}}" aria-label="Snapshot"><button id="play" type="button">Play</button></div>
    </div>
    <div class="field">
      <span class="lab">Phase</span>
      <div class="chips" id="chips"></div>
    </div>
    <div class="field" data-waves>
      <label for="cby">Color by</label>
      <select id="cby"><option value="phase">Phase (fit rule)</option><option value="wave">Wave group (publication volume)</option><option value="arch">Lifepath archetype (DTW)</option></select>
    </div>
    <div class="field"><span class="lab">Lifepaths</span><div class="snap" style="gap:8px"><input type="checkbox" id="allP" checked aria-label="Show every snapshot with connecting lines"><label for="allP" style="text-transform:none;letter-spacing:0">show every snapshot, joined by lines</label></div></div>
    <div class="field" id="wfield" style="display:none">
      <span class="lab">Groups</span>
      <div class="chips" id="wchips"></div>
      <label style="display:flex;gap:6px;align-items:center;font-size:12px;margin-top:8px"><input type="checkbox" id="pth" checked> Draw lifepaths (bold line = group average path)</label>
      <label style="display:flex;gap:6px;align-items:center;font-size:12px;margin-top:6px"><input type="checkbox" id="tnt" checked> Include terms under 100 papers (assigned by model; fainter when less certain)</label>
      <label style="display:flex;gap:6px;align-items:center;font-size:12px;margin-top:6px">Minimum certainty <select id="tcf"><option value="0">any</option><option value="40">40%</option><option value="60">60%</option><option value="80">80%</option></select></label>
    </div>
    <div class="field">
      <label for="minp">Minimum papers</label>
      <select id="minp"><!--MINOPTS--></select>
    </div>
    <details class="more" id="more"><summary>More settings: growth-rate rule, gap-fill rings, thresholds</summary><div class="morei">
    <div class="field">
      <span class="lab">Acceleration by growth rate</span>
      <div class="snap" style="gap:8px"><input type="checkbox" id="accOn" checked aria-label="Enable growth-rate acceleration"><label for="accOn" style="text-transform:none;letter-spacing:0">on, if papers grew ≥</label><input id="accR" type="number" step="0.05" min="1" max="5" value="1.3" style="width:70px"><label for="accM" style="text-transform:none;letter-spacing:0">× with ≥</label><input id="accM" type="number" step="5" min="1" max="500" value="20" style="width:70px"><label style="text-transform:none;letter-spacing:0">papers/yr</label></div>
    </div>
    <div class="field" data-gap>
      <span class="lab">Compare with original</span>
      <div class="snap" style="gap:8px"><input type="checkbox" id="ringOn" checked aria-label="Ring diseases whose phase changed"><label for="ringOn" style="text-transform:none;letter-spacing:0">ring diseases changed by the gap fill</label></div>
    </div>
    <div class="field">
      <span class="lab">Rule thresholds</span>
      <div class="snap" style="gap:8px"><label for="satT" style="text-transform:none;letter-spacing:0">saturation &lt;</label><input id="satT" type="number" step="0.01" min="0.9" max="3" value="1.05"><label for="dT" style="text-transform:none;letter-spacing:0">± months</label><input id="dT" type="number" step="0.5" min="0" max="12" value="1"><button class="reset" id="reset" type="button">Reset</button></div>
    </div>
    </div></details>
  </div>

  <div class="main">
    <div class="card plot" id="plotcard">
      <div class="zbar"><span class="zh">Zoom the scatter plot</span><button id="zin" type="button" aria-label="Zoom in" title="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out" title="Zoom out">−</button><button id="zreset" type="button" title="Reset zoom" disabled>Reset zoom</button></div>
      <div class="dhead dctl"><label for="dOn"><input type="checkbox" id="dOn" checked> <b>Density contours</b> (base layer)</label>
        <label for="dbw">Smoothing <select id="dbw"><option value="6">fine</option><option value="10" selected>medium</option><option value="16">broad</option></select></label>
        <label for="dw"><input type="checkbox" id="dw"> weight by papers</label></div>
      <canvas id="cv" role="img" aria-label="Scatter of diseases"></canvas>
      
      <div class="tip" id="tip" hidden></div>
      <div class="dleg" id="dleg"></div>
      <div class="dens" id="counts"></div>
      <div class="dens" data-gap>
        <div class="dhead"><span class="h3">Inflection dates: original vs gap-filled</span></div>
        <canvas id="cv3" role="img" aria-label="Number of diseases by fitted inflection date, original run versus gap-filled run"></canvas>
        <div class="dleg" id="dleg3"></div>
      </div>

  <section class="insights" id="insights" aria-labelledby="insh"><h2 id="insh">Insights</h2><p class="ins-s">What this page shows, and how to read it.</p><ul>{{insights}}</ul><h3 class="vh" id="vh"></h3><ul id="vins"></ul></section>
<details class="kchoice" id="kwave" data-cats style="display:none"><summary>How the wave groups were chosen: number of groups and minimum papers</summary>
<p><b>Number of groups.</b> Silhouette measures how well separated a grouping is (1 is perfect, near 0 means the groups overlap). For the wave groups (k-means on each term’s quarterly volume scaled to its own peak) the mean silhouette is highest at k=2 (0.217), drops to 0.151 at k=3 and rises slightly to 0.157 at k=4, a local peak, before falling again. We use <b>four wave groups</b>, as in the paper: Acute early (38 terms), Broad first wave (47), Late symptom (29) and Chronic core (43). This is a choice made for description, not the best-separated split: two groups would separate more cleanly. The weakest of the four, Late symptom, has a mean silhouette of only 0.05, and the partition is reproducible across random starts (seed ARI 0.99). The terms form a continuum: the groups are a descriptive split of it, not natural clusters.</p>

<p><b>Why 100 papers.</b> Core terms are the ones with at least 100 papers (157 terms, 81% of all disease mentions). A term with 100 papers has on average four papers per quarter over the 25 quarters, enough to give a curve shape, while at 10 papers most quarters are empty. Raising the cutoff improves separation (silhouette at k=4 rises from 0.081 at 10 papers to 0.172 at 200) and split-half agreement (0.14 to 0.29), but it discards terms: coverage falls from 95% to 73%, and at 200 only 88 terms remain. Agreement between random starts is high at every cutoff (seed ARI 0.92 or more). Split-half ARI, the agreement between groupings of two random halves of each term’s papers, stays modest (0.27 at 100 papers), so terms near a group boundary can change group when their papers change. There is no sharp optimum, and 100 is a round-number compromise that keeps four fifths of all mentions. Terms under 100 papers are not dropped: they are assigned to a group by a timing model, with a certainty value.</p>

<details class="kchoice" id="karch" data-cats style="display:none"><summary>How the lifepath archetypes were chosen: number of groups</summary>
<p><b>Number of groups.</b> Silhouette measures how well separated a grouping is (1 is perfect, near 0 means the groups overlap). Here each core term’s lifepath (its fitted inflection date and steepness at every snapshot, from the first fit with 5 or more papers) is compared with every other term’s by DTW distance, and the terms are joined by Ward linkage. The silhouette is computed on those DTW distances. It is highest at k=2 (0.354), then 0.257 at k=3 and 0.242 at k=4. We use <b>three archetypes</b>: Early exit (31 terms), Broad wave (62) and Late settling (64), named by how often a term’s lifepath ends in the Deactivated phase. Their mean silhouettes at k=3 are 0.239, 0.304 and 0.220: positive for all three but modest, so the archetypes overlap. This is a descriptive split of a continuum, not a set of natural clusters.</p>

<script>

let satT=1.05,dT=1,accOn=true,accR=1.3,accM=20;

const tw_=r=>!WAVE[r[0]]&&TENT[r[0]]&&TENT[r[0]][0]>=0,ta_=r=>!(WAVE[r[0]]&&WAVE[r[0]][1]>=0)&&TENT[r[0]]&&TENT[r[0]][1]>=0;

const WTw=DATA.map(r=>tw_(r)?1:0),WTa=DATA.map(r=>ta_(r)?1:0);let tentOn=true,minConf=0;const WCf=DATA.map(r=>tw_(r)?TENT[r[0]][2]:100),ACf=DATA.map(r=>ta_(r)?TENT[r[0]][3]:100);const cfOf=i=>colorBy==='wave'?WCf[i]:ACf[i];
const isT=i=>colorBy==='wave'?WTw[i]:WTa[i];
const WCV=({2:['--w0','--w3'],3:['--w0','--w1','--w3'],4:['--w0','--w1','--w2','--w3']})[NW]||['--w0','--w1','--w2','--w3'],ACV=NA===2?['--w0','--w3']:['--w0','--w1','--w3'];
let colorBy='phase';const gon=[true,true,true,true,true];
const UNG=()=>colorBy==='wave'?NW:NA;
const catOf=i=>colorBy==='phase'?cph[i]:(colorBy==='wave'?(WG[i]>=0&&(!WTw[i]||(tentOn&&WCf[i]>=minConf))?WG[i]:NW):(AR[i]>=0&&(!WTa[i]||(tentOn&&ACf[i]>=minConf))?AR[i]:3));
const catCol=c=>colorBy==='phase'?phCol(c):(c===UNG()?css('--axis'):css((colorBy==='wave'?WCV:ACV)[c]));
const ORDER=()=>colorBy==='phase'?[3,2,1,0]:(colorBy==='wave'?[NW].concat(WN.map((_,i)=>i)):[NA].concat(AN.map((_,i)=>i)));
const ALPHA=ph=>colorBy==='phase'?(ph===3?.42:.72):(ph===UNG()?.14:.8);
const groupOn=i=>colorBy==='phase'?true:gon[catOf(i)];

const NAMES=DATA.map(r=>r[1]),LOW=NAMES.map(n=>n.toLowerCase());
{const i=DATA.findIndex(r=>r[1]==='Post-Acute COVID-19 Syndrome');if(i>=0)sel=i}

// ---- Leila's classification, recomputed in the browser -----------------------
//  sat = fitted saturation A (= r2/max_s); dm = months from inflection to analysis date
//  sat < satT -> Deactivated(3); else dm > dT -> Deceleration(2); dm < -dT -> Acceleration(0); else Inflection(1)
const anaDay=k=>(Date.UTC(SNAPS[k][0],SNAPS[k][1],0)-BASE)/864e5;
const dmo=(d,k)=>(anaDay(k)-d[0])/30;
// growth-rate acceleration: papers in the last w months vs the w months before (w = 12, or fewer early on),
// counted as accelerating when the ratio is >= accR, there are >= accM papers per year, and the rise is
// statistically clear (Poisson z >= 2). This works on monthly counts, so it does not depend on the sigmoid fit.
const PS=DATA.map(r=>{const a=new Int32Array(NM+1);for(let i=0;i<NM;i++)a[i+1]=a[i]+r[2][i];return a});
function growth(i,k){const n=nmon(k),w=Math.min(12,n>>1);if(w<6)return null;
  const r1=PS[i][n]-PS[i][n-w],r0=PS[i][n-w]-PS[i][n-2*w];
  const ok=r1>=accM*w/12&&r1>=accR*Math.max(r0,1)&&(r1-r0)/Math.sqrt(r1+r0)>=2;
  return {r1,r0,w,ok}}
const fitClass=(d,k)=>d[6]<satT?3:(dmo(d,k)>dT?2:(dmo(d,k)<-dT?0:1));
const classify=(d,k,i)=>{if(accOn){const g=growth(i,k);if(g&&g.ok)return 0}return fitClass(d,k)};
let COUNTS=[],CHG=[];
let ringOn=!!GAP;
const origPhase=(i,k)=>{const o=DATA[i][4][k];if(!o)return -1;const m=(anaDay(k)-o[0])/30;return o[1]<satT?3:(m>dT?2:(m<-dT?0:1))};
const changed=(i,k)=>{const d=DATA[i][3][k];if(!d)return false;const o=origPhase(i,k);return o>=0&&fitClass(d,k)!==o};
function recls(){
  COUNTS=SNAPS.map(()=>[0,0,0,0]);CHG=SNAPS.map(()=>0);
  DATA.forEach((r,i)=>r[3].forEach((d,k)=>{if(!d)return;d[3]=classify(d,k,i);COUNTS[k][d[3]]++;if(changed(i,k))CHG[k]++}));
}

// ---- chips
PH.forEach((p,i)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.setAttribute('aria-pressed','true');
  b.innerHTML='<span class="dot" style="background:var(--c'+i+')"></span>'+p;
  b.onclick=()=>{on[i]=!on[i];b.setAttribute('aria-pressed',on[i]);dDirty=true;redraw()};$('chips').appendChild(b)});

// ---- canvas + coordinate systems
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;const M={l:48,r:14,t:12,b:34};
let X0=-60,X1=CFG.x1||3100,Y0=0.7,Y1=6.6;
let xmode='n',RX0=(CFG.rx||[2,10])[0],RX1=(CFG.rx||[2,10])[1];const RY0=-70,RY1=52;
function setXmode(m){xmode=m;if(m==='n'){RX0=(CFG.rx||[2,10])[0];RX1=(CFG.rx||[2,10])[1]}else{RX0=Math.log(0.9);RX1=Math.log(30)}zw.rule=null;syncWin();updZoomUI();retarget(true)}
const TOTN=DATA.map(r=>{for(let k=r[3].length-1;k>=0;k--)if(r[3][k])return Math.max(r[3][k][2],2);return 2});
const RCOL=['#3a7d1e','#0000ff','#e8301f','#000000'];
const iw=()=>W-M.l-M.r,ih=()=>H-M.t-M.b;
// visible window (changes with zoom): [x0,x1,y0,y1]. paths: x=days, y=ln slope (small at top). rule: x=ln(saturation), y=months (large at top)
let VX0=X0,VX1=X1,VY0=Y0,VY1=Y1;const zw={paths:null,rule:null};
const fullWin=()=>view==='paths'?[X0,X1,Y0,Y1]:[RX0,RX1,RY0,RY1];
function syncWin(){[VX0,VX1,VY0,VY1]=zw[view]||fullWin()}
const px=t=>M.l+(t-VX0)/(VX1-VX0)*iw(), py=y=>M.t+(y-VY0)/(VY1-VY0)*ih();
const rx=v=>M.l+(v-VX0)/(VX1-VX0)*iw(), ry=v=>M.t+(VY1-v)/(VY1-VY0)*ih();
function scr(i,k){const d=DATA[i][3][k];
  return view==='paths'?[px(d[0]),py(d[1])]:[rx(xmode==='n'?Math.log(Math.max(d[2],1)):Math.log(clamp(d[6],0.9,30))),ry(clamp(dmo(d,k),RY0,RY1))]}
const rad=o=>Math.min(2.2+Math.sqrt(o)*0.075,15);
const LVL=__P.lvl||[];let lvlF=0;const vis=(d,i)=>d&&on[d[3]]&&d[2]>=minP&&groupOn(i)&&(lvlF===0||LVL[i]===lvlF);
const matches=i=>query&&LOW[i].includes(query);

// ---- animated state
const cx=new Float32Array(N),cy=new Float32Array(N),ca=new Float32Array(N);
const sx=new Float32Array(N),sy=new Float32Array(N),sa=new Float32Array(N);
const tx=new Float32Array(N),ty=new Float32Array(N),ta=new Float32Array(N);
const cph=new Int8Array(N).fill(3),pph=new Int8Array(N).fill(3),tph=new Int8Array(N).fill(3);
let tw=1,twStart=0,raf=0,DUR=900;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function retarget(instant){
  for(let i=0;i<N;i++){const d=DATA[i][3][si];
    sx[i]=cx[i];sy[i]=cy[i];sa[i]=ca[i];pph[i]=cph[i];
    if(d){const p=scr(i,si);tx[i]=p[0];ty[i]=p[1];ta[i]=1;tph[i]=d[3];if(ca[i]<.01){sx[i]=tx[i];sy[i]=ty[i]}}
    else{tx[i]=cx[i];ty[i]=cy[i];ta[i]=0;tph[i]=cph[i]}}
  if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches){tw=1;apply(1)}else{tw=0;twStart=performance.now();if(!raf)raf=requestAnimationFrame(frame)}
  redraw()}
function apply(e){dDirty=true;for(let i=0;i<N;i++){cx[i]=sx[i]+(tx[i]-sx[i])*e;cy[i]=sy[i]+(ty[i]-sy[i])*e;ca[i]=sa[i]+(ta[i]-sa[i])*e;cph[i]=e<.5?pph[i]:tph[i]}}
function frame(ts){raf=0;tw=Math.min(1,(ts-twStart)/DUR);apply(ease(tw));draw();if(tw<1)raf=requestAnimationFrame(frame)}
let pend=0;function redraw(){if(raf||pend)return;pend=requestAnimationFrame(()=>{pend=0;draw()})}

function size(){DPR=window.devicePixelRatio||1;const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;
  H3=cv3.getBoundingClientRect().height;cv3.width=W*DPR;cv3.height=H3*DPR;dDirty=true;retarget(true)}

function nice(a,b,n){const raw=(b-a)/n,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,st=(m<1.5?1:m<3?2:m<7?5:10)*p,o=[];for(let v=Math.ceil(a/st)*st;v<=b+1e-9&&o.length<60;v+=st)o.push(+v.toFixed(10));return o}
function dateTicks(a,b){const span=b-a,step=span>2000?12:span>900?6:span>450?3:1,o=[];
  const d0=new Date(BASE+a*864e5);let y=d0.getUTCFullYear(),m=Math.floor(d0.getUTCMonth()/step)*step;
  for(let i=0;i<200;i++){const t=(Date.UTC(y,m,1)-BASE)/864e5;if(t>b)break;
    if(t>=a)o.push({d:t,label:step===12?String(y):(m===0?String(y):MON[m]+' '+String(y).slice(2))});m+=step;if(m>=12){y+=Math.floor(m/12);m%=12}}
  return o}
const LOGT=[0.9,0.95,1,1.05,1.1,1.2,1.3,1.5,2,3,5,7,10,15,20,30];
function star(x,y,r){ctx.beginPath();for(let j=0;j<10;j++){const a=-Math.PI/2+j*Math.PI/5,q=j%2?r*.45:r;ctx[j?'lineTo':'moveTo'](x+q*Math.cos(a),y+q*Math.sin(a))}ctx.closePath();ctx.fill()}
function axes(){
  ctx.font='11px '+css('--mono');ctx.textBaseline='middle';
  const grid=css('--grid'),axis=css('--axis'),muted=css('--muted'),x1=W-M.r,y1=H-M.b;ctx.lineWidth=1;
  const clipPlot=()=>{ctx.save();ctx.beginPath();ctx.rect(M.l,M.t,iw(),ih());ctx.clip()};

    const now=px(anaDay(si));if(now<x1){const a=Math.max(now,M.l);ctx.fillStyle=css('--chip');ctx.globalAlpha=.55;ctx.fillRect(a,M.t,x1-a,ih());ctx.globalAlpha=1}
    ctx.restore();
    ctx.fillStyle=muted;ctx.textAlign='right';yt.forEach(v=>{if(inY(py(v)))ctx.fillText(+v.toFixed(2),M.l-8,py(v))});
    ctx.textAlign='center';let lastX=-1e9;xt.forEach(t=>{const x=px(t.d);if(x>=M.l-2&&x<=x1+2&&x-lastX>42){ctx.fillText(t.label,x,y1+14);lastX=x}});
    if(now<x1-70){ctx.textAlign='right';ctx.fillText('projected',x1-6,M.t+10)}
    ctx.save();ctx.translate(12,M.t+ih()/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('ln(slope), steeper is lower',0,0);ctx.restore();
  }else{
    const gr='#d4d4d4',tx='#222';
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
    clipPlot();

<body>
<div class="hero"><div class="hin"><!--NAV--><header><h1>{{title}}</h1><p class="lead">{{sub}}</p></header></div></div>
<div class="wrap">
  <details class="card rd" style="padding:12px 16px;margin-bottom:14px"><summary><b>How to read this, and what it does not show</b></summary>
    <p class="note" style="margin:8px 0 0"><b>What it is.</b> Each dot is a term named in the same set of papers, and a line means at least two papers name both terms. It maps what researchers write about together. It is not data from patients.</p>
    <p class="note" style="margin:6px 0 0"><b>What it can support.</b> A guide to which topics, genes and lab models are studied together in the Long COVID literature, and a way to reach the papers behind them. Each term links to its PubMed papers, and those papers are the evidence.</p>
    <p class="note" style="margin:6px 0 0"><b>What it does not show.</b></p>
    <ul class="note" style="margin:2px 0 0 18px;padding:0">
      <li>That a gene, cytokine or cell line is a biomarker, a cause or a treatment target. Being named in the same paper does not mean it was measured in patients or differs from controls.</li>
      <li>That two symptoms/comorbidities are linked. A review that lists many topics will join them all.</li>
      <li>Anything about testing, treatment or risk for an individual patient.</li>
      <li>A pattern, when it rests on one paper. A single paper that names a long list of terms creates many links at once, so check the papers before relying on a link.</li>
      <li>A reliable count. Only a small share of papers name variants or cell lines, and a few tags are wrong (for example "12p70" is the cytokine IL-12 p70, not a chromosome).</li>
    </ul>
    <p class="note" style="margin:6px 0 0">Communities are groups found by an algorithm. They can change with the settings, so treat them as a way to explore, not as established groups.</p>
  </details>
  <div class="ctl">
    <div class="field"><label>Show</label><div class="chips" id="tys"></div></div>
    <div class="field"><label for="mine">Minimum papers per link</label><select id="mine"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
    <div class="field"><label for="cby">Colour by</label><select id="cby"><option value="type">Type of term</option><option value="comm" selected>Community</option></select></div>
    <div class="field" id="gfield"><label for="gam">Community size</label><select id="gam"><option value="0.6">Larger</option><option value="1" selected>Standard</option><option value="1.6">Smaller</option></select></div>
    <label class="cb"><input type="checkbox" id="hub" checked> hide terms named in more than 30% of these papers</label>
    <label class="cb"><input type="checkbox" id="core" checked> only links that involve a variant, cell line or chromosome</label>
    <div class="field"><label for="q">Find a term</label><input type="search" id="q" list="dl" placeholder="e.g. ACE2, A549, IL6"><datalist id="dl"></datalist></div>
  </div>
  <div class="cols">
    <div>
      <div class="cw" id="cw"><canvas id="nv" role="img" aria-label="Network of terms named in the same papers"></canvas><div class="tt" id="tt" hidden></div></div>
      <div class="gl" id="gl"></div>
      <p class="note" id="nnote"></p>
      <div class="card" id="br" style="padding:16px;margin-top:14px">
        <h3 style="margin:0 0 4px">Possible bridges</h3>
        <p class="note" style="margin:0 0 8px">Pairs of terms in different communities that are both linked to the same terms (terms linked to many others count for less), but that no paper in this set names together. Each one is a question to check, not a finding: the pair may be unexplored, or studied elsewhere under other words. Use the PubMed link to see whether papers already exist.</p>
        <div class="ctl" style="margin:0 0 8px"><div class="field"><label for="brmin">Terms they must share</label><select id="brmin"><option value="2" selected>2 or more</option><option value="3">3 or more</option><option value="4">4 or more</option></select></div><label class="cb"><input type="checkbox" id="brlc" checked> search PubMed for Long COVID papers only</label><button type="button" id="brclr" style="align-self:end">Clear highlight</button></div>
        <p class="note" id="brn" style="margin:0 0 6px"></p>
        <div id="brl" style="max-height:520px;overflow:auto"></div>
      </div>
    </div>
    <div class="side"><aside class="card" id="sel"></aside></div>
  </div>

</div>
<script>
const DATA=window.DASH_PAGE;
const {nodes,papers}=DATA,NP=papers.length;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COL={Variant:'#d9622b',Gene:'#2a78d6',CellLine:'#1a9b7f',Disease:'#8a6fb3',Chromosome:'#c9a227',Chemical:'#8b8a84'};
const LBL={Variant:'Variants',CellLine:'Cell lines',Chromosome:'Chromosomes and regions',Gene:'Genes',Disease:'Symptoms/comorbidities',Chemical:'Chemicals'};
const TY=['Variant','CellLine','Chromosome','Gene','Disease','Chemical'];
const MIS={'12p70':'This is tagged as a chromosome region, but "12p70" is almost certainly the cytokine IL-12 p70 (a protein), so the many links through it are a tagging artefact.'};
const gt=t=>t==='GenomicRegion'?'Chromosome':t;
const CORE=new Set(['Variant','CellLine','Chromosome','GenomicRegion']);
const on={Variant:true,CellLine:true,Chromosome:true,Gene:true,Disease:true,Chemical:false};
let HC=new Set(),cq='',colorBy='comm',gam=1,selC=-1,COM=new Map(),CI=[],modQ=0,minE=2,hideHub=true,coreOnly=true,sel=-1,G={ids:[],edges:[],nb:new Map()},pos=new Map(),W=900,H=620,view={k:1,x:0,y:0},alpha=0,raf=0,hover=-1,drag=null;
const present=TY.filter(t=>nodes.some(n=>gt(n[0])===t));
$('tys').innerHTML=present.map(t=>`<button type="button" class="chip" data-t="${t}" aria-pressed="${on[t]}"><i style="background:${COL[t]}"></i>${LBL[t]}</button>`).join('');
$('gl').innerHTML=present.map(t=>`<span><i style="background:${COL[t]}"></i>${LBL[t]}</span>`).join('');
$('dl').innerHTML=nodes.map(n=>`<option value="${esc(n[2])}">`).join('');
function legend(){
  if(colorBy==='comm'){const big=CI.filter(c=>c.mem.length>=3).slice(0,CCOL.length);$('gl').innerHTML=big.map(c=>`<span class="lg" role="button" tabindex="0" data-h="${c.ci}" title="Click to show or hide" style="cursor:pointer;${HC.has(c.ci)?'opacity:.4;text-decoration:line-through':''}"><i style="background:${ccol(c.ci)}"></i>Community ${c.ci+1}: ${esc(c.top.slice(0,2).map(i=>nodes[i][2]).join(', '))}</span>`).join('')+(CI.length>big.length?`<span><i style="background:${CGREY}"></i>${CI.length-big.length} small groups</span>`:'')}
  else $('gl').innerHTML=present.map(t=>`<span><i style="background:${COL[t]}"></i>${LBL[t]}</span>`).join('');
  $('gfield').style.display=colorBy==='comm'?'':'none'}
const rad=i=>3+Math.sqrt(nodes[i][3])*1.9;

const CCOL=['#2a78d6','#d9622b','#1a9b7f','#8a6fb3','#c9a227','#d6457a','#3a9bb5','#7a8f2a','#b5651d','#5b5fc7'],CGREY='#8b8a84';
const ccol=c=>c>=0&&c<CCOL.length?CCOL[c]:CGREY;
// community detection: Louvain modularity optimisation on the links shown (weights = papers), fixed node order so the result is repeatable

  const n=nodes[sel],nbs=(G.nb.get(sel)||[]).map(e=>({i:e.a===sel?e.b:e.a,w:e.w})).filter(o=>vis(o.i)).sort((a,b)=>b.w-a.w||nodes[b.i][3]-nodes[a.i][3]);
  const ps=papers.map((p,pi)=>[p,pi]).filter(([p])=>p[2].includes(sel));
  el.innerHTML=`<h3><i class="dot" style="background:${COL[gt(n[0])]}"></i> ${esc(n[2])}</h3>${cOf(sel)>=0?`<p class="note" style="margin:0 0 4px"><button type="button" data-c="${cOf(sel)}" style="padding:2px 8px;font-size:12px"><i class="dot" style="background:${ccol(cOf(sel))}"></i>Community ${cOf(sel)+1}</button></p>`:''}<p style="margin:0 0 8px;color:var(--ink2)">${LBL[gt(n[0])]}${n[0]==='GenomicRegion'?' (genomic region)':''} · named in ${n[3]} paper${n[3]>1?'s':''} of the ${NP}.</p>`+
   (MIS[n[2]]?`<p class="note" style="color:var(--c2);margin:0 0 8px"><b>Check:</b> ${esc(MIS[n[2]])}</p>`:'')+(nbs.length?`<h3>Linked with</h3><div class="lst">`+nbs.slice(0,40).map(o=>`<button type="button" data-i="${o.i}"><span><i class="dot" style="background:${COL[gt(nodes[o.i][0])]}"></i>${esc(nodes[o.i][2])}</span><span class="v">${o.w}</span></button>`).join('')+`</div><p class="note">Number of papers that name both.${nbs.length>40?' The 40 strongest are listed.':''}</p>`:'<p class="note">No links at the current settings.</p>')+
   `<h3 style="margin-top:14px">Papers</h3><p class="note" style="margin-top:0">`+ps.slice(0,30).map(([p])=>`<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(p[0])}/" target="_blank" rel="noopener">${esc(p[0])}</a> (${esc(p[1])})`).join(', ')+(ps.length>30?', and '+(ps.length-30)+' more':'')+'</p>'}
$('sel').addEventListener('change',e=>{const h=e.target.closest('input[data-h]');if(!h)return;const c=+h.dataset.h,n=new Set(HC);h.checked?n.delete(c):n.add(c);keepScroll(()=>setHidden(n))});
$('sel').addEventListener('input',e=>{if(e.target.id==='cq'){cq=e.target.value;memList()}});
$('gl').addEventListener('click',e=>{const h=e.target.closest('[data-h]');if(!h)return;const c=+h.dataset.h,n=new Set(HC);n.has(c)?n.delete(c):n.add(c);setHidden(n)});
$('gl').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const h=e.target.closest('[data-h]');if(h){e.preventDefault();h.click()}}});
$('sel').addEventListener('click',e=>{const o=e.target.closest('button[data-only]');if(o){const k=+o.dataset.only;setHidden(new Set(CI.map(c=>c.ci).filter(x=>x!==k)));fit(CI[k].mem);draw();return}const z=e.target.closest('button[data-z]');if(z){fit(CI[+z.dataset.z].mem);draw();return}const ha=e.target.closest('button[data-ha]');if(ha){keepScroll(()=>setHidden(ha.dataset.ha==='all'?new Set():new Set(CI.map(c=>c.ci))));return}
const c=e.target.closest('button[data-c]');if(c){selC=+c.dataset.c;sel=-1;cq='';BP=null;renderBridges();panel();draw();return}const b=e.target.closest('button[data-i]');if(b){sel=+b.dataset.i;selC=-1;BP=null;renderBridges();panel();draw()}});
$('tys').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(!b)return;on[b.dataset.t]=!on[b.dataset.t];b.setAttribute('aria-pressed',on[b.dataset.t]);build()});
$('cby').onchange=e=>{colorBy=e.target.value;legend();panel();draw()};$('gam').onchange=e=>{gam=+e.target.value;selC=-1;BP=null;communities();legend();renderBridges();$('nnote').innerHTML=$('nnote').innerHTML.replace(/in \d+ communities \(modularity [\d.]+\)/,'in '+CI.length+' communities (modularity '+modQ.toFixed(2)+')');panel();draw()};$('mine').onchange=e=>{minE=+e.target.value;build()};$('hub').onchange=e=>{hideHub=e.target.checked;build()};$('core').onchange=e=>{coreOnly=e.target.checked;build()};
$('br').addEventListener('click',e=>{const b=e.target.closest('button[data-bp]');if(b){const[a,c]=b.dataset.bp.split('|').map(Number),o=bridges().find(x=>x.a===a&&x.b===c);if(o){setBP(o);$('nv').scrollIntoView({block:'center',behavior:'smooth'})}return}if(e.target.id==='brall'){brAll=!brAll;renderBridges()}if(e.target.id==='brclr')setBP(null)});
$('brmin').onchange=e=>{brMin=+e.target.value;BP=null;renderBridges();draw()};$('brlc').onchange=e=>{brLC=e.target.checked;renderBridges()};
$('q').addEventListener('change',e=>{const v=e.target.value.trim().toLowerCase();if(!v){draw();return}let i=nodes.findIndex(n=>n[2].toLowerCase()===v);if(i<0)i=nodes.findIndex(n=>n[2].toLowerCase().includes(v));if(i<0)return;
  if(!G.ids.includes(i)){minE=1;$('mine').value='1';on[gt(nodes[i][0])]=true;document.querySelectorAll('#tys button').forEach(b=>b.setAttribute('aria-pressed',on[b.dataset.t]));hideHub=false;$('hub').checked=false;coreOnly=false;$('core').checked=false;build()}
  sel=i;const p=pos.get(i);if(p){view.x=W/2-p.x*view.k;view.y=H/2-p.y*view.k}panel();draw()});
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>setTimeout(draw,0));
let _rz;addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(size,150)});
size();build();

<\/script>
</body></html></script>
<script type="text/plain" id="tpl-chemexp"><div class="dens" id="chemexp">
<style>
#chemexp summary::-webkit-details-marker{display:none}
#chemexp details:not([open]) .chev{display:inline-block}
#chemexp .cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:8px 0 10px}
#chemexp .cg>div{border:1px solid var(--grid);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.5;color:var(--ink2)}
#chemexp .cg strong{display:block;color:var(--ink);margin-bottom:3px}
#chemexp .cg em{font-style:normal;color:var(--muted)}
#chemexp .ex{font-size:12px;line-height:1.7;color:var(--ink2);margin:4px 0 0}
#chemexp .ex b{color:var(--ink);font-weight:600}
</style>
<details id="chemdet"><summary class="dhead" style="cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px"><span class="h3">What chemicals are here</span><span class="chev" aria-hidden="true" style="font-size:11px;color:var(--muted)">▾ click to expand or collapse</span></summary>
<div class="cg">
<div><strong>Substances named in the text</strong>A chemical is any substance the PubTator tagger finds in a paper and links to a MeSH substance identifier: drugs, hormones and other biological compounds, gases, imaging agents and lab chemicals. Genes, proteins, cell lines, species and variants are not chemicals here; they have their own pages. <em>For example remdesivir, glucose, oxygen, fluorodeoxyglucose F18.</em></div>
<div><strong>Named is not given</strong>A mention only means the substance appears in the paper, not why. The same chemical can play very different roles. <b>Treatments:</b> remdesivir, dexamethasone, steroids, nirmatrelvir and ritonavir, tocilizumab. <b>Supportive care:</b> oxygen, heparin. <b>Measurements and biomarkers:</b> glucose, creatinine, lipids, lactic acid, measured in blood or tissue to describe a patient. <b>Tests and imaging agents:</b> fluorodeoxyglucose F18 and gadolinium for scans; carbon monoxide often stands for the lung-function test DLCO, not for a drug. <b>Exposures or possible causes:</b> a substance a study links to illness rather than to care. The tagger does not tell these apart, so a chemical’s curve shows how often it is discussed, not how often it is used to treat Long COVID.</div>
<div><strong>How they are counted</strong>Each chemical counts once per paper, however often the paper names it, and only chemicals with enough papers are shown. Mentions without an identifier are left out. Counts are small, so a lifepath rests on few points.</div>
<div><strong>Chemicals have their own groups</strong>The chemicals above a paper-count cutoff (30 papers by default, see “How the chemical groups were chosen”) are grouped on their own, by volume over time (wave groups) and by lifepath shape (archetypes), with the number of groups chosen by silhouette. Chemicals with fewer papers are placed in the nearest group by a timing model. Read those placements as tentative.</div>
<div id="chgrp" style="display:none"></div>
</div>
<p class="ex" id="chex"></p></details>
<script>
(function(){
 function init(){
  var el=document.getElementById('chex');if(!el||typeof DATA==='undefined'||!DATA.length)return;
  var t=DATA.map(function(r){var s=0,c=r[2];for(var i=0;i<c.length;i++)s+=c[i];return [r[1],s]}).sort(function(a,b){return b[1]-a[1]}).slice(0,10);
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  el.innerHTML='Most-mentioned chemicals in this data: '+t.map(function(x){return '<b>'+esc(x[0])+'</b> ('+x[1].toLocaleString('en-US')+')'}).join(', ')+'. Numbers are papers.';
 }
 if(document.readyState==='complete')init();else window.addEventListener('load',init);
})();
<\/script>
</div></script>
<script type="text/plain" id="tpl-catexp"><div class="dens" id="catexp">
<style>
#catexp .stp{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:8px 0 14px}
#catexp .stp>div{border:1px solid var(--grid);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.5;color:var(--ink2)}
#catexp .stp strong{display:block;color:var(--ink);margin-bottom:3px}
#catexp .stp .n{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;margin-right:6px}
#catexp .tr{border-left:2px solid var(--grid);margin:6px 0 0 8px;padding-left:12px;font-size:12px}
#catexp .tr .rt{font-weight:600;color:var(--ink)}
#catexp .tr .cat{margin:6px 0 4px;color:var(--ink);font-weight:600}
#catexp .tr .cat span{font-weight:400;color:var(--muted)}
#catexp .tm{display:grid;grid-template-columns:minmax(120px,230px) minmax(60px,1fr) auto;gap:8px;align-items:center;padding:2px 0 2px 12px;border-left:2px solid var(--grid);margin-left:0}
#catexp .tm .bar{height:8px;border-radius:2px;background:var(--accent);opacity:.55}
#catexp .tm .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
#catexp .tm .v{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#catexp .tm small{color:var(--muted)}
#catexp .ov{margin:8px 0 0;font-size:12px;line-height:1.5;color:var(--ink2)}
</style>
<div class="dhead"><span class="h3">How terms are grouped into categories</span></div>
<div class="stp">
<div><strong><span class="n">1</span>Every term has a place in the MeSH tree</strong>MeSH, the US National Library of Medicine's vocabulary, files each term under one or more paths of a tree that starts at "Diseases".</div>
<div><strong><span class="n">2</span>The first step down is the category</strong>For the path Diseases › Infections › Respiratory Tract Infections, the category is Infections and the subcategory is Infections › Respiratory Tract Infections (one level deeper).</div>
<div><strong><span class="n">3</span>Monthly mentions are added up</strong>For each month, the papers that name each member term are summed. A paper naming two terms of the same category counts twice, and a term with several paths is added to each of its categories.</div>
<div><strong><span class="n">4</span>One curve, one dot</strong>The summed counts get the same logistic fit and phase rule as a single term, so a dot shows when the area as a whole drew attention.</div>
</div>
<div class="dhead"><span class="h3" style="font-size:13px">See what sits under a category</span><label>Category <select id="cxsel"></select></label></div>
<div id="cxout"></div>
<div class="dleg">Terms are listed with every paper count they have, not only the terms with 100 or more papers. Bars are scaled to the largest term in the category. "Also in" shows the other categories a term is added to. Subcategories work the same way one level deeper; their member terms are not listed here. Terms that are not in the Diseases tree (mental disorders, OMIM and supplementary concepts) are added up as one separate category.</div>
<script>
(function(){
 function init(){
 var box=document.getElementById('catexp'),T=window.DASH_TERMS;
 if(!box)return;
 if(!T||!T.rows||!T.mcat){box.style.display='none';return}
 var rows=T.rows,mc=T.mcat,by={},tot=[];
 function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 function fmt(n){return n.toLocaleString('en-US')}
 rows.forEach(function(r,i){var s=0,c=r[2];for(var k=0;k<c.length;k++)s+=c[k];tot[i]=s;(mc[r[0]]||[]).forEach(function(g){(by[g]=by[g]||[]).push(i)})});
 var names=Object.keys(by);if(!names.length){box.style.display='none';return}
 var sum={};names.forEach(function(g){sum[g]=by[g].reduce(function(a,i){return a+tot[i]},0)});
 names.sort(function(a,b){return sum[b]-sum[a]});
 var sel=document.getElementById('cxsel'),out=document.getElementById('cxout');
 sel.innerHTML=names.map(function(g){return '<option value="'+esc(g)+'">'+esc(g.length>60?g.slice(0,57)+'…':g)+' ('+by[g].length+' terms)</option>'}).join('');
 var multi=0,inTree=0,best=-1,bi=-1;
 rows.forEach(function(r,i){var cs=mc[r[0]]||[];if(cs.length&&cs[0].indexOf('Outside the')!==0){inTree++;if(cs.length>1){multi++;var sc=cs.length*1e6+tot[i];if(sc>best){best=sc;bi=i}}}});
 function show(){
  var g=sel.value,idx=by[g].slice().sort(function(a,b){return tot[b]-tot[a]}),mx=tot[idx[0]]||1,top=idx.slice(0,12);
  var ct=sum[g];try{if(typeof DATA!=='undefined'){for(var q=0;q<DATA.length;q++){if(DATA[q][1]===g&&String(DATA[q][0]).indexOf('L2:')===0){ct=DATA[q][2].reduce(function(a,b){return a+b},0);break}}}}catch(e){}
  var shown=top.reduce(function(a,i){return a+tot[i]},0);
  var h='<div class="tr"><div class="rt">MeSH tree</div><div class="cat">'+esc(g)+' <span>category · '+fmt(idx.length)+' terms · '+fmt(ct)+' mentions added up</span></div>';
  top.forEach(function(i){
   var o=(mc[rows[i][0]]||[]).filter(function(x){return x!==g});
   h+='<div class="tm"><span class="nm" title="'+esc(rows[i][1])+'">'+esc(rows[i][1])+(o.length?' <small>also in '+esc(o.slice(0,2).join(', '))+(o.length>2?' +'+(o.length-2):'')+'</small>':'')+'</span><span><div class="bar" style="width:'+Math.max(2,Math.round(100*tot[i]/mx))+'%"></div></span><span class="v">'+fmt(tot[i])+'</span></div>';
  });
  if(idx.length>top.length)h+='<div class="tm"><span class="nm"><small>+ '+fmt(idx.length-top.length)+' more terms, '+fmt(Math.max(0,ct-shown))+' mentions</small></span><span></span><span></span></div>';
  h+='</div>';
  h+='<p class="ov">These '+fmt(idx.length)+' terms are added month by month into the single lifepath of <b>'+esc(g)+'</b>.'+(g.indexOf('Outside the')===0?' This category collects the terms MeSH does not file under Diseases.':'')+'</p>';
  out.innerHTML=h;
 }
 sel.onchange=show;
 var d=names.indexOf('Infections');sel.selectedIndex=d>=0?d:0;show();
 if(multi&&bi>=0){var o=document.createElement('p');o.className='ov';o.innerHTML='In this data, of the '+fmt(inTree)+' terms in the MeSH Diseases tree, '+fmt(multi)+' ('+Math.round(100*multi/inTree)+'%) have more than one tree path and are counted in each of their categories, so category totals overlap and do not add up to the number of mentions. Example: <b>'+esc(rows[bi][1])+'</b> is in '+esc((mc[rows[bi][0]]||[]).slice(0,3).join(', '))+((mc[rows[bi][0]]||[]).length>3?' and '+((mc[rows[bi][0]]||[]).length-3)+' more':'')+'.';out.parentNode.insertBefore(o,out.nextSibling)}
 }
 if(document.readyState==='complete')init();else window.addEventListener('load',init);
})();
<\/script>
</div></script>
<script type="text/plain" id="tpl-celluse"><!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: control bar on top; big scatter (inflection time x slope) left, selected-chemical detail right; stacks on phones. */
:root{
  --bg:#f6f6f3; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#7b7a74; --grid:#e1e0d9; --axis:#c3c2b7;
  --accent:#2a78d6; --c0:#17935f; --c1:#4a3aa7; --c2:#d9622b; --c3:#8b8a84; --ring:#0b0b0b; --chip:#efeeea; --w0:#d9622b; --w1:#8a6fb3; --w2:#1a9b7f; --w3:#2a78d6;
  --serif:'IBM Plex Serif',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#8f8e88; --grid:#2c2c2a; --axis:#383835;
  --accent:#3987e5; --c0:#3fbf7f; --c1:#9085e9; --c2:#e66767; --c3:#7d7c76; --ring:#ffffff; --chip:#242422; --w0:#f08a5d; --w1:#b39ddb; --w2:#35c4a6; --w3:#3987e5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#8f8e88; --grid:#2c2c2a; --axis:#383835;
  --accent:#3987e5; --c0:#3fbf7f; --c1:#9085e9; --c2:#e66767; --c3:#7d7c76; --ring:#ffffff; --chip:#242422; --w0:#f08a5d; --w1:#b39ddb; --w2:#35c4a6; --w3:#3987e5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:20px 32px}

.bar{position:sticky;top:0;z-index:15;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
label,.lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
input[type=search],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--axis);border-radius:6px;padding:7px 10px;min-width:0}
input[type=search]{width:min(320px,100%)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{position:relative;flex:1 1 260px;max-width:360px}
.results{position:absolute;z-index:20;top:100%;left:0;right:0;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--axis);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:320px;overflow:auto}
.results li{padding:6px 8px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.results li[aria-selected=true],.results li:hover{background:var(--chip)}
.results .n{font:400 11px var(--mono);color:var(--muted);white-space:nowrap}
.results mark{background:none;color:var(--accent);font-weight:600}
.snap{display:flex;align-items:center;gap:10px}
input[type=range]{width:200px;max-width:100%;accent-color:var(--accent)}
.yr{font:500 20px var(--mono);min-width:9ch}
button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--axis);border-radius:6px;padding:6px 12px;cursor:pointer}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.card{background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:14px;min-width:0}
.plot{position:relative}
canvas{display:block;width:100%;height:540px;touch-action:manipulation;cursor:crosshair}

.zbar{display:flex;gap:4px;justify-content:flex-end;align-items:center;margin-bottom:8px}
.zbar .zh{margin-right:auto;font-size:12px;color:var(--muted)}
.zbar button{padding:4px 0;width:30px;background:var(--surface)}
.zbar #zreset{width:auto;padding:4px 9px;font-size:12px}
#cv2{height:300px;cursor:default;touch-action:auto}
#cv3{height:180px;cursor:default;touch-action:auto}
@media (max-width:600px){#cv2{height:220px}}
.dens{margin-top:14px;padding-top:12px;border-top:1px solid var(--grid)}

<body>
<div class="hero"><div class="hin"><!--NAV--><header><h1>{{title}}</h1><p class="lead">{{sub}}</p></header></div></div>
<div class="wrap">
  <details class="card rd" style="padding:12px 16px;margin-bottom:14px"><summary><b>How to read this, and what it does not show</b></summary>
    <p class="note" style="margin:8px 0 0"><b>What it is.</b> Each row is a cell line, with the symptoms/comorbidities, chemicals or genes named in the same papers. It maps what researchers write about together. It is not data from patients.</p>
    <p class="note" style="margin:6px 0 0"><b>What it can support.</b> A guide to which topics, genes and lab models are studied together in the Long COVID literature, and a way to reach the papers behind them. Each term links to its PubMed papers, and those papers are the evidence.</p>
    <p class="note" style="margin:6px 0 0"><b>What it does not show.</b></p>
    <ul class="note" style="margin:2px 0 0 18px;padding:0">
      <li>That a gene, cytokine or cell line is a biomarker, a cause or a treatment target. Being named in the same paper does not mean it was measured in patients or differs from controls.</li>
      <li>That two symptoms/comorbidities are linked. A review that lists many topics will join them all.</li>
      <li>Anything about testing, treatment or risk for an individual patient.</li>
      <li>A pattern, when it rests on one paper. A single paper that names a long list of terms creates many links at once, so check the papers before relying on a link.</li>
      <li>A reliable count. Only a small share of papers name variants or cell lines, and a few tags are wrong (for example "12p70" is the cytokine IL-12 p70, not a chromosome).</li>
    </ul>
    <p class="note" style="margin:6px 0 0">Only topics named in at least two of a line's papers are listed, and many lines have none. Tissue and species come from a small hand-made lookup.</p>
  </details>
  <div class="card" style="padding:16px">
    <h3 style="margin:0 0 4px">Papers by tissue and species</h3>
    <p class="note" style="margin:0 0 12px" id="barnote"></p>
    <div id="bars"></div>
    <div class="gl" id="spleg"></div>
  </div>
  <div class="ctl">
    <div class="field"><label for="cview">Show as</label><select id="cview"><option value="table" selected>Table</option><option value="matrix">Matrix</option></select></div>
    <div class="field"><label for="ct">Topics</label><select id="ct"><option value="Disease">Symptoms/comorbidities</option><option value="Chemical">Chemicals</option><option value="Gene">Genes</option></select></div>
    <div class="field mx"><label for="cc">Minimum papers per cell</label><select id="cc"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></div>
    <div class="field mx"><label for="cm">Minimum papers per column</label><select id="cm"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5">5</option></select></div>
    <label class="cb"><input type="checkbox" id="chub" checked> hide terms named in more than 30% of these papers</label>
    <label class="cb"><input type="checkbox" id="ccode" checked> hide cell lines with no usable name and tags that are not cell lines</label>
  </div>
  <div class="card" style="padding:16px">
    <h3 style="margin:0 0 4px" id="mhead">Which cell lines are named with which topics</h3>
    <p class="note" style="margin:0 0 10px" id="mnote"></p>
    <div class="cw" id="mwrap" style="max-height:none;overflow:auto"><table id="mtab" class="mt"></table></div>
    <div id="mpap" class="note" style="margin-top:10px"></div>
  </div>

</div>
<script>
const DATA=window.DASH_PAGE;
const {nodes,papers}=DATA;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// small hand-made lookup: cell line -> [tissue group, species]. Keyed by Cellosaurus accession, with names as a fallback.
const G_LUNG='Lung and airway',G_KID='Kidney',G_IMM='Blood and immune',G_GUT='Gut (colon)',G_LIV='Liver',G_NER='Nervous system',G_HRT='Heart',G_CRV='Cervix',G_BON='Bone and cartilage',G_END='Endothelium',G_STM='Stem or progenitor cells',G_MOU='Mouse strain or model',G_NOT='Not a cell line (tagging error)',G_COD='Name not available (code only)',G_OTH='Not classified';
const ORDER=[G_LUNG,G_KID,G_IMM,G_GUT,G_LIV,G_NER,G_HRT,G_CRV,G_BON,G_END,G_STM,G_MOU,G_NOT,G_COD,G_OTH];
const BYID={'CVCL:0023':[G_LUNG,'human'],'CVCL:0609':[G_LUNG,'human'],'CVCL:0168':[G_LUNG,'human'],'CVCL:0440':[G_LUNG,'human'],'CVCL:0298':[G_LUNG,'human'],
 'CVCL:0574':[G_KID,'monkey'],'CVCL:0059':[G_KID,'monkey'],'CVCL:0045':[G_KID,'human'],'CVCL:0063':[G_KID,'human'],
 'CVCL:0006':[G_IMM,'human'],'CVCL:0493':[G_IMM,'mouse'],'CVCL:0003':[G_IMM,'human'],'CVCL:4360':[G_IMM,'human'],
 'CVCL:0025':[G_GUT,'human'],'CVCL:0027':[G_LIV,'human'],'CVCL:0019':[G_NER,'human'],'CVCL:0286':[G_HRT,'rat'],'CVCL:0030':[G_CRV,'human'],'CVCL:0543':[G_BON,'human'],'CVCL:3901':[G_END,'human'],'CVCL:3228':[G_STM,'unknown'],
 'CVCL:0184':[G_MOU,'mouse'],'CVCL:0192':[G_MOU,'mouse'],'CVCL:4564':[G_MOU,'mouse'],'CVCL:2869':[G_NOT,'unknown'],'CVCL:8280':[G_NOT,'unknown'],'CVCL:9469':[G_NOT,'unknown']};
const BYNAME={'a549':[G_LUNG,'human'],'calu-3':[G_LUNG,'human'],'beas-2b':[G_LUNG,'human'],'mrc-5':[G_LUNG,'human'],'vero e6':[G_KID,'monkey'],'vero':[G_KID,'monkey'],'hek293':[G_KID,'human'],'293t':[G_KID,'human'],'thp-1':[G_IMM,'human'],'raw264.7':[G_IMM,'mouse'],'caco-2':[G_GUT,'human'],'hepg2':[G_LIV,'human'],'sh-sy5y':[G_NER,'human'],'h9c2':[G_HRT,'rat'],'hela':[G_CRV,'human'],'huh-7':[G_LIV,'human'],'huh7':[G_LIV,'human'],'jurkat':[G_IMM,'human'],'u937':[G_IMM,'human']};
const grp=n=>{const k=n[1];if(BYID[k])return BYID[k];const nm=(n[2]||'').toLowerCase();if(BYNAME[nm])return BYNAME[nm];if(nm===String(k).replace(/^CVCL:/,'').toLowerCase())return[G_COD,'unknown'];return[G_OTH,'unknown']};
const SPC={human:'#2a78d6',monkey:'#d9622b',mouse:'#1a9b7f',rat:'#c9a227',unknown:'#8b8a84'};
const cells=[];nodes.forEach((n,i)=>{if(n[0]==='CellLine'){const g=grp(n);cells.push({i,n:n[2],id:n[1],p:n[3],g:g[0],s:g[1]})}});
const cellSet=new Map(cells.map(c=>[c.i,c]));
const cp=papers.map((p,pi)=>({p,pi,cl:p[2].filter(i=>cellSet.has(i))})).filter(o=>o.cl.length);
const NPc=cp.length;
// ---- bars: distinct papers per tissue group, split by species
const byG={};ORDER.forEach(g=>byG[g]={papers:new Set(),sp:{},lines:new Set()});
cp.forEach(o=>o.cl.forEach(i=>{const c=cellSet.get(i),b=byG[c.g];b.papers.add(o.pi);b.lines.add(i);(b.sp[c.s]=b.sp[c.s]||new Set()).add(o.pi)}));
const WEAK=[G_NOT,G_COD,G_OTH];
const rowsB=ORDER.filter(g=>byG[g].papers.size).map(g=>({g,n:byG[g].papers.size,l:byG[g].lines.size,sp:byG[g].sp})).sort((a,b)=>(WEAK.includes(a.g)-WEAK.includes(b.g))||b.n-a.n);
const mx=Math.max(1,...rowsB.map(r=>r.n));
$('bars').innerHTML=rowsB.map(r=>`<div style="display:grid;grid-template-columns:minmax(120px,230px) 1fr 140px;gap:10px;align-items:center;margin:4px 0"><span style="${r.g===G_NOT||r.g===G_COD||r.g===G_OTH?'color:var(--muted)':''}">${esc(r.g)}</span><div style="display:flex;height:18px;background:var(--chip);border-radius:4px;overflow:hidden">`+Object.keys(SPC).filter(s=>r.sp[s]).map(s=>`<i title="${esc(r.g)}, ${s}: ${r.sp[s].size} papers" style="display:block;width:${r.sp[s].size/mx*100}%;background:${SPC[s]}"></i>`).join('')+`</div><span class="v" style="font:400 12px var(--mono);color:var(--ink2)">${r.n} paper${r.n>1?'s':''} · ${r.l} line${r.l>1?'s':''}</span></div>`).join('');
$('spleg').innerHTML=Object.keys(SPC).map(s=>`<span><i style="background:${SPC[s]}"></i>${s}</span>`).join('');
$('barnote').innerHTML=`${NPc} papers name at least one of ${cells.length} cell-line tags. A paper that names lines from two tissues counts once in each bar. Groups come from a small hand-made lookup of ${Object.keys(BYID).length} accession numbers; tags that are really mouse strains (BALB/c, C57Bl/6) or other things are kept apart, and the rest have only a code as their name.`;
// ---- matrix
const TYPES={Disease:'symptoms/comorbidities',Chemical:'chemicals',Gene:'genes'};
const MORE=new Set();
function table(){
  const ty=$('ct').value,hide=$('chub').checked,hideCode=$('ccode').checked;
  const rows=cells.filter(c=>!hideCode||![G_COD,G_NOT,G_OTH].includes(c.g)).sort((a,b)=>ORDER.indexOf(a.g)-ORDER.indexOf(b.g)||b.p-a.p||a.n.localeCompare(b.n));
  let h='<thead><tr><th class="tl">Cell line</th><th class="tl">Tissue or group</th><th class="tl">Species</th><th class="tr">Papers</th><th class="tl">Papers (PubMed)</th><th class="tl">'+TYPES[ty][0].toUpperCase()+TYPES[ty].slice(1)+' named in more than one of its papers</th></tr></thead><tbody>';
  rows.forEach(c=>{const m=new Map(),pl=[];cp.forEach(o=>{if(!o.cl.includes(c.i))return;pl.push(o.p);o.p[2].forEach(j=>{if(nodes[j][0]!==ty)return;if(hide&&nodes[j][3]>0.3*papers.length)return;m.set(j,(m.get(j)||0)+1)})});
    pl.sort((a,b)=>String(b[1]).localeCompare(String(a[1])));
    const open=MORE.has(c.i),cap=open?pl.length:6;

    const rep=[...m.entries()].filter(([j,v])=>v>=2).sort((a,b)=>b[1]-a[1]||nodes[a[0]][2].localeCompare(nodes[b[0]][2]));

function matrix(){

  cols.sort((a,b)=>{const x=best(a),y=best(b);return(+x[0]-+y[0])||(y[1]-x[1])||(tot.get(b)-tot.get(a))||nodes[a][2].localeCompare(nodes[b][2])});
  const vmax=Math.max(1,...[...cnt.values()]);
  const BL=['#f7fbff','#c6dbef','#6baed6','#2171b5','#08306b'],dark=parseInt(css('--surface').slice(1,3),16)<128;
  const bg=v=>{if(!v)return'transparent';const u=Math.min(1,v/Math.max(vmax,3));if(dark)return`rgba(57,135,229,${.15+.8*u})`;return BL[Math.min(4,Math.round(u*4))]};
  let h='<thead><tr><th class="rh"></th>'+cols.map(j=>`<th class="ch" title="${esc(nodes[j][2])}"><span>${esc(nodes[j][2].length>26?nodes[j][2].slice(0,25)+'…':nodes[j][2])}</span></th>`).join('')+'</tr></thead><tbody>';
  let lastG='';
  rows.forEach(c=>{if(c.g!==lastG){lastG=c.g;h+=`<tr><td class="gh" colspan="${cols.length+1}">${esc(c.g)}</td></tr>`}
    h+=`<tr><th class="rh"><i class="dot" style="background:${SPC[c.s]}"></i>${esc(c.n)} <span class="v">${c.p}</span></th>`+cols.map(j=>{let v=cnt.get(c.i+'|'+j)||0;if(v<minCell)v=0;return v?`<td><button type="button" data-i="${c.i}" data-j="${j}" style="background:${bg(v)};color:${v/vmax>.5?'#fff':'var(--ink)'}">${v}</button></td>`:'<td></td>'}).join('')+'</tr>'});
  $('mtab').innerHTML=h+'</tbody>';
  $('mnote').innerHTML=`${rows.length} cell lines by ${cols.length} ${TYPES[ty]}. Each number is the count of papers that name both. Dot colour is the species. Cell lines are in tissue groups; columns follow the group where they are used most. Only cells with at least ${minCell} paper${minCell>1?'s':''} are shown. Click a number to list the papers.${!cols.length?' Nothing reaches the minimum: lower it.':''}`;
  $('mpap').innerHTML='';
}
$('mtab').addEventListener('click',e=>{const mo=e.target.closest('button[data-more]');if(mo){const i=+mo.dataset.more;MORE.has(i)?MORE.delete(i):MORE.add(i);table();return}const b=e.target.closest('button[data-i]');if(!b)return;const i=+b.dataset.i,j=+b.dataset.j;
  const ps=papers.filter(p=>p[2].includes(i)&&p[2].includes(j));$('mpap').innerHTML=`<b>${esc(nodes[i][2])}</b> with <b>${esc(nodes[j][2])}</b>: `+ps.map(p=>`<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(p[0])}/" target="_blank" rel="noopener">${esc(p[0])}</a> (${esc(p[1])})`).join(', ')});
['cview','ct','cm','cc','chub','ccode'].forEach(id=>$(id).addEventListener('change',matrix));

matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>setTimeout(matrix,0));
matrix();

<script>
(function(){

function loadJs(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('cannot load '+src));document.head.appendChild(s)})}

function nav(man,cur){return '<nav class="pgnav" aria-label="Dashboards">'+man.pages.filter(p=>!HIDDEN_PAGES.includes(p.id)).map(p=>'<a href="?page='+p.id+DQ+'"'+(p.id===cur?' aria-current="page"':'')+' data-tip="'+$e(TIPS[p.id]||('Lifepaths for '+p.nav.toLowerCase()+'.'))+'">'+$e(NAVLAB[p.id]||p.nav)+'</a>').join('')+'</nav>'}
function leadFor(c){
  const n=c.noun||'term',ns=c.nouns||'terms';
  const tail=' A four-phase rule then says where it stands today. Use the controls to move through time, search for a '+n+', and change the rule to see how sensitive each label is.';
  if(c.kind==='cooc')return 'Which chemicals are written about together with which symptoms/comorbidities? Each cell compares how often a symptom/comorbidity and a chemical appear in the same paper with how often they would by chance. Rows are symptoms/comorbidities and columns are chemicals, grouped so that related ones sit together. Use it to see which treatments, tests and mechanisms the literature attaches to which conditions, and how that changed over time.';
  if(c.kind==='categories')return 'A lifepath follows one topic through the literature over time. Here a topic is a MeSH category: the monthly mentions of every term under it are added up, a growth curve (a sigmoid) is fitted to the running total at half-year snapshots, and the fit gives an inflection date, when publication growth peaked, and a steepness, how sharp the rise was. Joining a category’s snapshots gives its lifepath.'+tail;
  if(c.kind==='clusters')return 'A lifepath follows one topic through the literature over time. Here a topic is a cluster of symptom and comorbidity terms (PubTator disease tags linked to MeSH, so the clusters are based on disease tags only) that gained or lost share of the literature in a similar way: the monthly mentions of its member terms are added up, a growth curve (a sigmoid) is fitted to the running total at half-year snapshots, and the fit gives an inflection date, when publication growth peaked, and a steepness, how sharp the rise was. Joining a cluster’s snapshots gives its lifepath.'+tail;
  if(c.id==='diseases')return 'Long COVID is a complex system of symptoms and comorbidities that, taken together, make up the condition. This page shows how each of them was researched and represented in '+(leadFor.NP?leadFor.NP.toLocaleString('en-US'):'thousands of')+' PubMed publications on Long COVID'+(leadFor.R?', dated '+leadFor.R:'')+'. A catalog like PubMed is built for transactional search: you type a term and get a list of papers. This page shows the entire system of terms instead. Every line with dots is a set of symptoms or comorbidities, and each dot places it at one moment in time by when research on it took off and how sharply it rose. Moving through time shows how the whole picture took shape and how lifepaths formed waves. A lifepath follows one symptom or comorbidity through that literature over time. For each one we count the papers that mention it month by month, fit a growth curve (a sigmoid) to the running total at half-year snapshots, and read two numbers off the fit: the inflection date, when publication growth peaked, and the steepness, how sharp the rise was. Joining a term’s snapshots gives its lifepath. The methodology is described in “Sigmoid-Parameterized Lifepaths: A Dynamic Framework for Analyzing Research Trajectories in Scholarly Ecosystems”, forthcoming in Quantitative Science Studies. Read side by side, the lifepaths show how Long COVID took shape as a collective: which symptoms and comorbidities the literature took up first, which rose together, and which are still accelerating. The page also holds the lifepaths of COVID-19 itself and of Post-Acute COVID-19 Syndrome, the MeSH term for Long COVID, so the two can be compared. Long COVID emerged later than acute COVID-19 and then caught up with it in the number of papers, and because MeSH files it under Infections, it is indexed as an infection-related condition and also appears in the Infections category (see the Categories page). Search for either term to follow its path. Counts are papers in this Long COVID collection, so the COVID-19 lifepath shows its place within Long COVID research, not the whole COVID-19 literature. A four-phase rule then says where each one stands today. Use the controls to move through time, search for a symptom or comorbidity, and change the rule to see how sensitive each label is.';
  const nn=c.id==='diseases'?'disease or symptom term':n;
  return 'A lifepath follows one '+nn+' through the literature over time. For each one we count the papers that mention it month by month, fit a growth curve (a sigmoid) to the running total at half-year snapshots, and read two numbers off the fit: the inflection date, when publication growth peaked, and the steepness, how sharp the rise was. Joining a '+n+'’s snapshots gives its lifepath.'+tail}
function insightsFor(c){
  const t=(c.insights&&c.insights.length)?c.insights.join(' '):(c.sub||'');
  const parts=t.replace(/([.?!])\s+(?=[A-Z<“"])/g,'$1\u0001').split('\u0001').map(x=>x.trim()).filter(Boolean);

function fill(s,vars){return s.replace(/\{\{(\w+)\}\}/g,(m,k)=>vars[k]===undefined?'':vars[k])}
function build(man,P){
  leadFor.NP=man.papers;{const MN=['January','February','March','April','May','June','July','August','September','October','November','December'],f=s=>s?MN[+s.slice(5,7)-1]+' '+s.slice(0,4):'';leadFor.R=man.first_month&&man.last_month?f(man.first_month)+' to '+f(man.last_month):''}
