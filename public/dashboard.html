    s=fill(TPL('tpl-cooc'),{title:$e(c.title),lead:leadFor(c),insights:insightsFor(c)}).replace('<!--NAV-->',nav(man,c.id));
    return s}
  s=TPL('tpl-app');
  const isMain=c.id==='diseases';
  // the table of terms grouped by MeSH category belongs on the MeSH categories page, not on the Diseases page
  const CTX=/<div class="dens" id="cattab" data-cats>[\s\S]*?header to sort\.<\/div>\s*<\/div>/;let catBlock='';
  if(isMain||c.kind==='categories'){const m=s.match(CTX);if(m){catBlock=m[0];s=s.replace(CTX,'<!--CATTAB-->')}}
  const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
  if(isMain){s=s.replace('No disease name matches','No symptom/comorbidity name matches').replace('the wave groups and the selected disease','the wave groups and the selected symptom/comorbidity').replace('Search diseases by name','Search symptoms/comorbidities by name').replace('aria-label="Scatter of diseases"','aria-label="Scatter of symptoms and comorbidities"')}
  if(!isMain){s=s.replace(/diseases/g,c.nouns).replace(/disease/g,c.noun).replace(/Disease/g,cap(c.noun))}
  if(!isMain){s=s.replace('Include terms under 100 papers (assigned by model; fainter when less certain)','Show '+c.nouns+' assigned by the timing model (fainter when less certain)')}
  if(c.id==='chemicals')s=s.replace('<p class="lead">{{lead}}</p>','<p class="lead" data-fold="1">{{lead}}</p>');   // show the full explanation, not the folded version
  if(c.id==='chemicals'){const GL=/      <div class="card" id="glists" data-lists>[\s\S]*?<\/div><\/div>\n/;const m=s.match(GL);
    if(m){s=s.replace(GL,'');s=s.replace('      <div class="dens" id="gterms"',m[0].replace('class="card" id="glists"','class="dens" id="glists"')+'      <div class="dens" id="gterms"')}}   // chemicals by group sits under "Lifepaths by group"
  const staleNote=(c.id==='chemicals'&&!c.an)?'<p style="margin:8px 0 0;padding:10px 14px;border:2px solid #c0392b;border-radius:8px;font-size:13px;color:var(--ink)"><b>This data folder is out of date.</b> The chemicals on this page are still using the groups borrowed from symptoms/comorbidities. The new chemical groups (their own two wave groups and two archetypes) are in <b>data_chemical_groups.zip</b>: unzip it and replace every file in the <code>data/</code> folder next to this page, then reload with a hard refresh (Ctrl/Cmd+Shift+R).</p>':'';
  const gapNote=staleNote+(c.gap?'<p style="margin:8px 0 0;padding:8px 12px;border:1px solid var(--grid);border-radius:8px;font-size:12px;color:var(--ink2)">This data folder was built with the 2024 collection gap filled in. Gap filling is now off by default: re-run build_dashboard_data.py and replace the data folder to see the data as collected.</p>':'');
  const opts=(c.minopts||[0]).map(v=>'<option value="'+v+'"'+(v===c.minP?' selected':'')+'>'+(v===0?'All':v.toLocaleString('en-US')+'+')+'</option>').join('');
  s=fill(s,{title:$e(c.title),lead:leadFor(c),insights:insightsFor(c),ph:$e(c.ph||''),minN:c.minN||5,lastSnap:man.snaps.length-1}).replace('<!--MINOPTS-->',opts).replace('<!--NAV-->',nav(man,c.id)+gapNote);

  if(c.id==='chemicals')s=s.replace('<div class="wrap">\n\n  <div class="bar">','<div class="wrap">\n'+TPL('tpl-chemexp')+'\n  <div class="bar">');   // what chemicals are: right under the title, before the controls
  // sections that only make sense for some pages
  const hide=a=>{s=s.split(' '+a+'>').join(' style="display:none">').split(' '+a+' ').join(' style="display:none" ')};
  const flags={'data-gap':!!c.gap,'data-cats':!!c.cats||!!c.extra,'data-waves':!!c.waves,'data-levels':!!c.levels,'data-lists':!!c.lists};
  Object.keys(flags).forEach(k=>{if(flags[k]){s=s.split(' '+k+'>').join('>').split(' '+k+' ').join(' ')}else hide(k)});
  if(!c.waves)s=s.replace('<select id="cby">','<select id="cby" disabled>');
  return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+s}
const FOLD="(function(){\n var st=document.createElement('style');st.textContent='.fold-more[hidden]{display:none}.fold-btn{all:unset;cursor:pointer;color:var(--accent,#1a5fb4);text-decoration:underline;text-underline-offset:2px;margin-left:6px;font-size:inherit;white-space:nowrap}.fold-btn:focus-visible{outline:2px solid var(--accent,#1a5fb4);outline-offset:2px}';document.head.appendChild(st);\n var bal=function(s){return (s.match(/<b>/g)||[]).length===(s.match(/<\\/b>/g)||[]).length};\n document.querySelectorAll('header .lead, header .sub').forEach(function(el,n){\n  if(el.dataset.fold)return;var h=el.innerHTML;if(h.length<420)return;\n  var parts=[],last=0,re=/[.?!](\\s+)(?=[A-Z<\u201c\"])/g,m;while((m=re.exec(h))){parts.push(h.slice(last,m.index+1));last=m.index+m[0].length}parts.push(h.slice(last));if(parts.length<3)return;\n  var k=0,len=0;while(k<parts.length-1&&len<260){len+=parts[k].length+1;k++}\n  var a=parts.slice(0,k).join(' '),b=parts.slice(k).join(' ');if(!b||!bal(a)||!bal(b))return;\n  var id='fold'+n;el.dataset.fold=1;\n  el.innerHTML=a+' <span class=\"fold-more\" id=\"'+id+'\" hidden>'+b+'</span><button type=\"button\" class=\"fold-btn\" aria-expanded=\"false\" aria-controls=\"'+id+'\">Read more</button>';\n  var btn=el.querySelector('.fold-btn'),sp=el.querySelector('.fold-more');\n  btn.onclick=function(){var open=sp.hidden;sp.hidden=!open;btn.setAttribute('aria-expanded',String(open));btn.textContent=open?'Show less':'Read more'};\n });\n})();\n";
async function main(){
